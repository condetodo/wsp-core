<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/assets/branding.css">
<script src="/assets/branding.js" defer></script>
<title>Historial de envíos</title>
<style>
  :root{--bg:#efece4;--surface:#fffdf8;--surface-2:#f7f4ec;--ink:#23211d;--muted:#827d72;
    --line:#e7e1d4;--line-strong:#d9d2c2;
    --ok:#137a52;--ok-soft:#e2f0e8;--err:#c1502a;--err-soft:#f7e7df;--r:14px;}
  *{box-sizing:border-box}html,body{height:100%}
  body{font-family:system-ui,sans-serif;margin:0;color:var(--ink);background:var(--bg);height:100vh;display:flex}
  .rail{width:190px;flex:none;background:var(--accent-ink);display:flex;flex-direction:column;overflow:auto}
  .logo-card{margin:14px 12px 10px;background:#fff;border-radius:10px;padding:8px 10px}
  .logo-card img{display:block;width:100%;max-width:110px;margin:0 auto}
  .rail-label{font-size:10px;color:var(--rail-muted);letter-spacing:1.5px;margin:8px 18px 4px;text-transform:uppercase}
  .rail a{display:flex;align-items:center;gap:10px;margin:2px 10px;padding:8px 10px;border-radius:9px;
    text-decoration:none;color:var(--rail-muted);font-size:13px;font-weight:600}
  .rail a svg{width:17px;height:17px;flex:none}
  .rail a:hover{background:var(--rail-hover);color:#fff}
  .rail a.active{background:#fff;color:var(--accent-ink)}
  .rail-foot{margin-top:auto;padding:10px;border-top:1px solid var(--rail-line)}
  .rail-user{display:flex;align-items:center;gap:9px;background:var(--rail-deep);border-radius:9px;padding:8px 10px}
  .rail-user .av{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
  .rail-user .info{flex:1;min-width:0;color:#fff}
  .rail-user .info b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-user .info small{font-size:10px;color:var(--rail-muted)}
  .rail-user form{margin:0}
  .rail-user button{cursor:pointer;border:0;background:none;color:var(--rail-muted);padding:4px;display:grid;place-items:center}
  .rail-user button:hover{color:#fff}
  .wrap{flex:1;overflow:auto;padding:24px}
  h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
  .btn{cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    font-weight:600;padding:9px 16px;border-radius:9px}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--muted);font-weight:600}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:var(--surface-2)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .chip.ok{background:var(--ok-soft);color:var(--ok)}
  .chip.err{background:var(--err-soft);color:var(--err)}
  .muted{color:var(--muted)}
  .hidden{display:none}
  .backlink{display:inline-block;margin-bottom:10px;color:var(--accent-ink);cursor:pointer;font-size:13px;font-weight:600}
  .head-meta{font-size:13px;color:var(--muted);margin:2px 0}
</style>
</head>
<body>
<nav class="rail">
  <div class="logo-card"><img src="/assets/logo.svg" alt=""></div>
  <div class="rail-label">Panel</div>
  <a href="/panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l1.3-3.9C1.976 12.663 2.874 8.228 6.4 5.726c3.526-2.501 8.59-2.296 11.845.48 3.255 2.777 3.695 7.266 1.029 10.501-2.666 3.235-7.615 4.215-11.574 2.293z"/></svg>Conversaciones</a>
  <a href="/panel/plantillas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 9h1"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>Plantillas</a>
  <a href="/panel/encuestas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17.75l-6.172 3.245 1.179-6.873-5-4.867 6.9-1L12 2l3.093 6.255 6.9 1-5 4.867 1.179 6.873z"/></svg>Encuestas</a>
  <a href="/panel/envio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14L21 3"/><path d="M21 3l-6.5 18a.55.55 0 0 1-1 0l-3.5-7-7-3.5a.55.55 0 0 1 0-1z"/></svg>Envío</a>
  <a href="/panel/historial" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="M9 12h.01"/><path d="M13 12h2"/><path d="M9 16h.01"/><path d="M13 16h2"/></svg>Historial</a>
  <a href="/panel/metricas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="6" height="8" rx="1"/><rect x="9" y="8" width="6" height="12" rx="1"/><rect x="15" y="4" width="6" height="16" rx="1"/></svg>Métricas</a>
  <a href="/panel/costos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.8 9A2 2 0 0 0 13 8h-2a2 2 0 1 0 0 4h2a2 2 0 1 1 0 4h-2a2 2 0 0 1-1.8-1"/><path d="M12 7v10"/></svg>Costos</a>
  <div class="rail-foot">
  <div class="rail-user">
    <span class="av" id="railAv">·</span>
    <div class="info"><b id="railYo">…</b><small>Conectado</small></div>
    <form method="post" action="/panel/logout"><button type="submit" title="Cerrar sesión" aria-label="Cerrar sesión"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2"/><path d="M9 12h12l-3-3m0 6 3-3"/></svg></button></form>
  </div>
  </div>
</nav>
<script>
fetch('/panel/api/yo').then(r=>r.json()).then(d=>{
  const u=(d&&d.usuario)||'—';
  document.getElementById('railYo').textContent=u;
  document.getElementById('railAv').textContent=(u[0]||'·').toUpperCase();
}).catch(()=>{});
</script>
<div class="wrap">

  <!-- LISTADO -->
  <div id="listado">
    <h1>Historial de envíos</h1>
    <p class="sub">Cada envío masivo realizado. Tocá una fila para ver el detalle por destinatario.</p>
    <div class="card">
      <table>
        <thead><tr>
          <th>Fecha</th><th>Plantilla</th>
          <th class="num">Total</th><th class="num">Enviados</th><th class="num">Errores</th><th>Estado</th>
        </tr></thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
  </div>

  <!-- DETALLE -->
  <div id="detalle" class="hidden">
    <span class="backlink" onclick="volver()">← Volver al listado</span>
    <h1 id="dTitulo">Detalle</h1>
    <p class="head-meta" id="dMeta"></p>
    <div class="card">
      <table>
        <thead><tr><th>Nombre</th><th>Teléfono</th><th>Estado</th><th>Motivo</th></tr></thead>
        <tbody id="dFilas"></tbody>
      </table>
    </div>
  </div>

</div>
<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fecha(x){ try{ return new Date(x).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return x||'—'; } }
function nombre(p){ return [p.nombre,p.apellido].filter(Boolean).join(' ') || '—'; }

async function cargarCampanias(){
  const r=await fetch('/panel/api/campanias'); const d=await r.json();
  const camps=d.campanias||[];
  document.getElementById('filas').innerHTML = camps.length ? camps.map(c=>
    `<tr class="clickable" onclick="abrirDetalle(${c.id})">`+
      `<td>${fecha(c.creada)}</td>`+
      `<td>${esc(c.plantilla_nombre||'(plantilla borrada)')}</td>`+
      `<td class="num">${c.total}</td>`+
      `<td class="num">${c.enviados}</td>`+
      `<td class="num">${c.errores}</td>`+
      `<td>${c.estado==='terminada'?'Terminada':esc(c.estado)}</td>`+
    `</tr>`
  ).join('') : '<tr><td colspan="6" class="muted">Todavía no hay envíos. Andá a “Envío masivo” para hacer el primero.</td></tr>';
}

async function abrirDetalle(id){
  const r=await fetch('/panel/api/campanias/'+id);
  if(!r.ok){ alert('No se pudo cargar el detalle.'); return; }
  const d=await r.json();
  const c=d.campania, envios=d.envios||[];
  document.getElementById('dTitulo').textContent=(c.plantilla_nombre||'(plantilla borrada)');
  document.getElementById('dMeta').textContent=
    `${fecha(c.creada)} · Total ${c.total} · Enviados ${c.enviados} · Errores ${c.errores}`+
    (c.creada_por?` · por ${c.creada_por}`:'');
  document.getElementById('dFilas').innerHTML = envios.length ? envios.map(e=>{
    const ok=e.estado==='enviado';
    return `<tr>`+
      `<td>${esc(nombre(e))}</td>`+
      `<td>${esc(e.numero||'—')}</td>`+
      `<td><span class="chip ${ok?'ok':'err'}">${ok?'Enviado':'Error'}</span></td>`+
      `<td class="muted">${ok?'—':esc(e.detalle||'—')}</td>`+
    `</tr>`;
  }).join('') : '<tr><td colspan="4" class="muted">Sin destinatarios registrados.</td></tr>';
  document.getElementById('listado').classList.add('hidden');
  document.getElementById('detalle').classList.remove('hidden');
  // Reflejamos la campaña abierta en la URL (para poder compartir/recargar).
  history.replaceState(null,'','/panel/historial?c='+id);
  document.querySelector('.wrap').scrollTop=0;
}

function volver(){
  document.getElementById('detalle').classList.add('hidden');
  document.getElementById('listado').classList.remove('hidden');
  history.replaceState(null,'','/panel/historial');
}

// Al abrir: siempre cargamos el listado. Si viene ?c=<id>, abrimos ese detalle.
(async()=>{
  await cargarCampanias();
  const id=new URLSearchParams(location.search).get('c');
  if(id) abrirDetalle(id);
})();
</script>
</body>
</html>
